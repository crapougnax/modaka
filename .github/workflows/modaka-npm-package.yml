# This workflow runs tests and builds/publishes @quatrain/modaka to GitHub Packages on push to main or manual dispatch.
# Inspired by api-common-npm-package.yml workflow pattern.

name: Modaka Node.js Package

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/modaka-npm-package.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: quatrain
  PACKAGE: modaka

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Node.js v22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Save date & short SHA
        id: vars
        run: |
          echo "today=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare package.json for NPM registry (Resolve local portal links)
        run: node ./bin/resolve-workspaces.cjs

      - name: Install dependencies from public NPM registry
        run: yarn install

      - name: Run unit tests with coverage
        run: yarn test --coverage.enabled=true

      - name: Run build
        run: yarn build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Update package version for dev release (TypeScript-style SemVer)
        run: npm version 0.1.0-dev.${{ steps.vars.outputs.today }}.${{ github.run_number }} --no-git-tag-version

      - name: Setup auth for GitHub Packages publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish in GitHub Packages repository
        run: npm publish --tag=latest-dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
