name: CI Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Node.js v22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Workspace Portal Dependencies
        run: node ./bin/resolve-workspaces.cjs

      - name: Install Dependencies
        run: yarn install

      - name: Run Unit Tests
        run: yarn test
